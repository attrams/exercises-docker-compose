services:
  redis:
    image: redis:8
    restart: unless-stopped

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    volumes:
      - ./database:/var/lib/postgresql

  backend:
    image: attrams/example-backend
    ports:
      - 8080:8080
    environment:
      REQUEST_ORIGIN: http://localhost:5001
      REDIS_HOST: redis
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
    depends_on:
      - redis
      - db

  frontend:
    image: attrams/example-frontend
    ports:
      - 5001:5001

  nginx:
    image: nginx
    ports:
      - 8000:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
